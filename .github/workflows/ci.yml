name: CI

on:
  pull_request:
  # En push a main NO corre: Deploy ya hace test + build antes de desplegar,
  # así un push lanza un solo workflow, no dos.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test -- --watch=false
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/detallito/browser
          retention-days: 5
