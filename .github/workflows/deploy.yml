name: Deploy

# main → producción (giftcards-bo.web.app), dev → pruebas (giftcards-bo-dev.web.app).
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # necesario para Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ github.ref_name == 'main' && 'giftcards-bo' || 'giftcards-bo-dev' }}
      CONFIG: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      url: https://${{ github.ref_name == 'main' && 'giftcards-bo' || 'giftcards-bo-dev' }}.web.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps
      - run: npm test -- --watch=false
      # Las reglas son toda la seguridad: si un caso se rompe, no se despliega.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm run test:rules
      - run: npx ng build --configuration $CONFIG

      # Sin claves en disco: GitHub se identifica por OIDC y Google le presta la service
      # account del ambiente. El pool vive en el proyecto de prod y sirve para los dos.
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT }}
          workload_identity_provider: projects/410167250500/locations/global/workloadIdentityPools/github/providers/gh-oidc
          service_account: ci-deploy@${{ env.PROJECT }}.iam.gserviceaccount.com

      - run: npx firebase-tools deploy --only hosting,firestore:rules,firestore:indexes --project $PROJECT --non-interactive
